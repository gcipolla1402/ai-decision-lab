[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-decision-lab-backend"
version = "0.1.0"
description = "Synthetic document analysis and typed decision routing portfolio demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "PyMuPDF>=1.24,<2",
  "google-genai>=1.0,<2",
  "typesafe-sdk>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

